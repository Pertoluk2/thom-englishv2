<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 2 Vocabulary - Thom's English App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Extra stijlen specifiek voor deze pagina */
        #image-matching-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            align-items: center;
        }
        .matching-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff9fb;
            padding: 15px;
            border-radius: 8px;
        }
        .matching-item img {
            max-width: 150px;
            height: 100px; /* Vaste hoogte voor uniformiteit */
            object-fit: cover; /* Zorgt dat de afbeelding netjes past */
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <h1>Unit 2: Date & Time Vocabulary</h1>
            <a href="vocabulary.html" class="back-button">← Quay lại Vocabulary Menu</a>
        </header>

        <section class="exercise-card">
            <h2>Bài tập 1: Kéo và thả</h2>
            <p>Kéo het juiste woord onder de afbeelding.</p>
            
            <div id="u2-a1-wordbank" class="word-bank-style">
                </div>

            <div id="image-matching-container">
                </div>

            <div class="button-group">
                <button id="check-u2-a1">Kiểm tra</button>
            </div>
        </section>

        <section class="exercise-card">
            <h2>Bài tập 2: Sắp xếp các ngày trong tuần</h2>
            <p>Sleep de dagen van de week in de juiste volgorde.</p>
            
            <div id="u2-a2-dropzone" class="sentence-drop-zone" style="min-height: 50px;">
                </div>
            <div id="u2-a2-pool" class="word-pool" style="min-height: 50px;">
                </div>

            <div class="button-group">
                <button id="check-u2-a2">Kiểm tra</button>
            </div>
            <p id="feedback-u2-a2" style="text-align: center; font-weight: bold; margin-top: 15px;"></p>
        </section>
    </div>
    <script src="unit2-vocabulary.js"></script>
</body>
</html>
