<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 5 Vocabulary - Thom's English App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #u5-a1-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            align-items: center;
        }
        .matching-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff9fb;
            padding: 15px;
            border-radius: 8px;
        }
        .matching-item img {
            max-width: 150px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <h1>Unit 5: Prices Vocabulary</h1>
            <a href="vocabulary.html" class="back-button">← Quay lại Vocabulary Menu</a>
        </header>

        <section class="exercise-card">
            <h2>Bài tập 1: Kéo và thả</h2>
            <p>Kéo het juiste woord onder de afbeelding.</p>
            <div id="u5-a1-wordbank" class="word-bank-style"></div>
            <div id="u5-a1-container"></div>
            <div class="button-group">
                <button id="check-u5-a1">Kiểm tra</button>
            </div>
        </section>

        <hr class="exercise-divider">

        <section class="exercise-card">
            <h2>Bài tập 2: Hoàn thành câu</h2>
            <p><strong>Hướng dẫn:</strong> Nhấp vào một khoảng trống, sau đó nhấp vào từ đúng từ hộp bên dưới.</p>
            <div id="u5-a2-wordbank" class="word-bank-style"></div>
            <div id="u5-a2-container"></div>
            <div class="button-group">
                <button id="check-u5-a2">Kiểm tra</button>
            </div>
            <p id="feedback-u5-a2" class="feedback-text"></p>
        </section>

    </div>
    <script src="unit5-vocabulary.js"></script>
</body>
</html>
